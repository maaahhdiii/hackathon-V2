<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active Service</title>
  <style>
    :root {
      --bg: #070b12;
      --fg: #e8f1ff;
      --muted: #97abc8;
      --accent: #39d0ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at 20% 20%, rgba(57, 208, 255, 0.16), transparent 36%),
        radial-gradient(circle at 80% 80%, rgba(119, 255, 168, 0.12), transparent 34%),
        linear-gradient(160deg, #05080d 0%, #0b1220 55%, #060a12 100%);
    }

    .wrap {
      text-align: center;
      padding: 24px;
    }

    .label {
      font-size: clamp(14px, 2vw, 24px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .value {
      font-size: clamp(40px, 12vw, 140px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 24px rgba(57, 208, 255, 0.35);
      line-height: 1;
    }

    .meta {
      margin-top: 16px;
      font-size: clamp(12px, 1.6vw, 18px);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="label">Current Active Service</div>
    <div class="value" id="active">WAITING</div>
    <div class="meta" id="meta">Loading battle status...</div>
  </main>

  <script>
    const vulnByService = {
      web: ['sqli', 'xss', 'auth_bypass'],
      api: ['insecure_ep', 'cmd_inject', 'idor'],
      file: ['path_traversal', 'exec_upload'],
      db: ['sqli', 'priv_esc']
    };

    async function refresh() {
      try {
        const res = await fetch('/proxy/current', { cache: 'no-store' });
        const data = await res.json();
        const activeService = (data.active_service || 'waiting').toLowerCase();
        const active = activeService.toUpperCase();
        const started = data.battle_started ? 'RUNNING' : 'NOT STARTED';
        const remaining = Number.isFinite(data.remaining_seconds) ? data.remaining_seconds : 0;
        const vulns = vulnByService[activeService] || ['waiting'];
        document.getElementById('active').textContent = active;
        document.getElementById('meta').textContent = 'Vulnerabilities: ' + vulns.join(', ') + ' | Battle: ' + started + ' | Slot Remaining: ' + remaining + 's';
      } catch (err) {
        document.getElementById('meta').textContent = 'Unable to read orchestrator status';
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
